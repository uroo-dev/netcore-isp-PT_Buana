services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: buanenet-app
    restart: unless-stopped
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=http://192.168.1.100:8080
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=PT_BUANA
      - DB_USERNAME=buana
      - DB_PASSWORD=buana123
      - SESSION_DRIVER=database
      - QUEUE_CONNECTION=database
      - CACHE_STORE=database
    volumes:
      - .:/var/www/html
      - app-storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
    networks:
      - buanenet

  nginx:
    image: nginx:alpine
    container_name: buanenet-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - buanenet

  db:
    image: mysql:8.0
    container_name: buanenet-db
    restart: unless-stopped
    environment:
      - MYSQL_DATABASE=PT_BUANA
      - MYSQL_USER=buana
      - MYSQL_PASSWORD=buana123
      - MYSQL_ROOT_PASSWORD=root123
    ports:
      - "3307:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - buanenet

volumes:
  app-storage:
  db-data:

networks:
  buanenet:
    driver: bridge
